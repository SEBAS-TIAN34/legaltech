apiVersion: apps/v1
kind: Deployment
metadata:
  name: dashboard-service
  namespace: legaltech
spec:
  replicas: 2
  selector:
    matchLabels:
      app: dashboard-service
  template:
    metadata:
      labels:
        app: dashboard-service
    spec:
      containers:
      - name: dashboard-service
        image: dashboard-service:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3008
        env:
        - name: PORT
          value: "3008"
        - name: DB_HOST
          valueFrom:
            secretKeyRef:
              name: legaltech-secrets
              key: DB_HOST
        - name: DB_PORT
          valueFrom:
            secretKeyRef:
              name: legaltech-secrets
              key: DB_PORT
        - name: DB_NAME
          valueFrom:
            secretKeyRef:
              name: legaltech-secrets
              key: DB_NAME
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: legaltech-secrets
              key: DB_USER
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: legaltech-secrets
              key: DB_PASSWORD
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: legaltech-secrets
              key: JWT_SECRET
        - name: AUTH_SERVICE_URL
          valueFrom:
            configMapKeyRef:
              name: legaltech-config
              key: AUTH_SERVICE_URL
        - name: CASES_SERVICE_URL
          valueFrom:
            configMapKeyRef:
              name: legaltech-config
              key: CASES_SERVICE_URL
        - name: CLIENTS_SERVICE_URL
          valueFrom:
            configMapKeyRef:
              name: legaltech-config
              key: CLIENTS_SERVICE_URL
        livenessProbe:
          httpGet:
            path: /health
            port: 3008
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /health
            port: 3008
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: dashboard-service
  namespace: legaltech
spec:
  type: ClusterIP
  ports:
  - port: 3008
    targetPort: 3008
  selector:
    app: dashboard-service