name: CI - Build & Test

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install auth-service dependencies
        run: |
          cd auth-service
          npm install --silent

      - name: Install cases-service dependencies
        run: |
          cd cases-service
          npm install --silent

      - name: Install notifications-service dependencies
        run: |
          cd notifications-service
          npm install --silent

      - name: Install clients-service dependencies
        run: |
          cd clients-service
          npm install --silent

      - name: Install documents-service dependencies
        run: |
          cd documents-service
          npm install --silent

      - name: Install time-tracking-service dependencies
        run: |
          cd time-tracking-service
          npm install --silent

      - name: Install billing-service dependencies
        run: |
          cd billing-service
          npm install --silent

      - name: Install dashboard-service dependencies
        run: |
          cd dashboard-service
          npm install --silent

      - name: Verify all services can be loaded
        run: |
          for dir in */; do
            if [ -f "${dir}package.json" ]; then
              echo "✓ ${dir} dependencies installed"
            fi
          done