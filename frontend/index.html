<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LegalTech - Iniciar Sesión</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="login-page">
  <div class="login-container">
    <div class="login-card">
      <div class="login-logo">
        <i class="fas fa-scale-balanced"></i>
        <h1>LegalTech</h1>
      </div>
      <p class="login-subtitle">Sistema de Gestión Legal</p>
      
      <div class="login-tabs">
        <button class="login-tab active" onclick="showTab('login')">Iniciar Sesión</button>
        <button class="login-tab" onclick="showTab('register')">Registrarse</button>
      </div>
      
      <!-- Login Form -->
      <form id="login-form" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="login-email" placeholder="tu@email.com" required>
        </div>
        <div class="form-group">
          <label>Contraseña</label>
          <input type="password" id="login-password" placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn-primary">Entrar</button>
      </form>
      
      <!-- Register Form -->
      <form id="register-form" class="hidden" onsubmit="handleRegister(event)">
        <div class="form-row">
          <div class="form-group">
            <label>Nombre</label>
            <input type="text" id="register-firstName" placeholder="Nombre" required>
          </div>
          <div class="form-group">
            <label>Apellido</label>
            <input type="text" id="register-lastName" placeholder="Apellido" required>
          </div>
        </div>
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="register-email" placeholder="tu@email.com" required>
        </div>
        <div class="form-group">
          <label>Contraseña</label>
          <input type="password" id="register-password" placeholder="••••••••" required>
        </div>
        <div class="form-group">
          <label>Tipo</label>
          <select id="register-role" required>
            <option value="lawyer">Abogado</option>
            <option value="client">Cliente</option>
          </select>
        </div>
        <button type="submit" class="btn-primary">Crear Cuenta</button>
      </form>
    </div>
  </div>

  <script>
    // Backend URL - Production (Render)
    const BASE_URL = 'https://juridico-z8ue.onrender.com';

    const API_URL = {
      auth: `${BASE_URL}/api/auth`,
      cases: `${BASE_URL}/api/cases`,
      clients: `${BASE_URL}/api/clients`,
      documents: `${BASE_URL}/api/documents`,
      timetracking: `${BASE_URL}/api/time-entries`,
      billing: `${BASE_URL}/api/invoices`
    };

    function showTab(tab) {
      document.querySelectorAll('.login-tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('form').forEach(f => f.classList.add('hidden'));
      
      if (tab === 'login') {
        document.querySelectorAll('.login-tab')[0].classList.add('active');
        document.getElementById('login-form').classList.remove('hidden');
      } else {
        document.querySelectorAll('.login-tab')[1].classList.add('active');
        document.getElementById('register-form').classList.remove('hidden');
      }
    }

    async function safeJson(res) {
      try {
        return await res.json();
      } catch (error) {
        return null;
      }
    }

    function parseErrorMessage(result, fallback) {
      if (!result) return fallback;
      if (typeof result.message === 'string' && result.message.trim()) return result.message;
      if (Array.isArray(result.errors) && result.errors.length > 0) {
        const firstError = result.errors[0];
        if (typeof firstError === 'string' && firstError.trim()) return firstError;
        if (firstError && typeof firstError.msg === 'string' && firstError.msg.trim()) return firstError.msg;
      }
      if (typeof result.error === 'string' && result.error.trim()) return result.error;
      return fallback;
    }

    function buildModernRegisterPayload({ firstName, lastName, email, password, role }) {
      return { firstName, lastName, email, password, role };
    }

    function buildLegacyRegisterPayload({ firstName, lastName, email, password, role }) {
      return {
        name: `${firstName} ${lastName}`.trim(),
        email,
        password,
        role: role === 'client' ? 'user' : role
      };
    }

    async function handleLogin(e) {
      e.preventDefault();
      const email = document.getElementById('login-email').value;
      const password = document.getElementById('login-password').value;
      
      try {
        const res = await fetch(`${API_URL.auth}/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const result = await safeJson(res);
        
        if (result && result.success) {
          const token = result?.data?.token || result?.token;
          const user = result?.data?.user || result?.data || result?.user;

          if (!token || !user) {
            alert('Respuesta de login incompleta desde el servidor');
            return;
          }

          localStorage.setItem('token', token);
          localStorage.setItem('user', JSON.stringify(user));
          
          // Single entry point - redirects based on role
          window.location.href = 'app.html';
        } else {
          alert(parseErrorMessage(result, 'Credenciales incorrectas'));
        }
      } catch (err) {
        alert('Error de conexion');
      }
    }

    async function handleRegister(e) {
      e.preventDefault();
      const firstName = document.getElementById('register-firstName').value;
      const lastName = document.getElementById('register-lastName').value;
      const email = document.getElementById('register-email').value;
      const password = document.getElementById('register-password').value;
      const role = document.getElementById('register-role').value;
      const registerData = { firstName, lastName, email, password, role };
      let result = null;
      let registerSuccess = false;
      
      try {
        const primaryRes = await fetch(`${API_URL.auth}/register`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(buildModernRegisterPayload(registerData))
        });
        result = await safeJson(primaryRes);

        if (result && result.success) {
          registerSuccess = true;
        } else {
          const message = (result?.message || '').toLowerCase();
          const shouldRetryLegacy =
            !result ||
            (!result.message && !Array.isArray(result.errors)) ||
            message.includes('name') ||
            message.includes('enum') ||
            message.includes('validation');

          if (shouldRetryLegacy) {
            const legacyRes = await fetch(`${API_URL.auth}/register`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(buildLegacyRegisterPayload(registerData))
            });
            const legacyResult = await safeJson(legacyRes);
            if (legacyResult) result = legacyResult;
            if (legacyResult && legacyResult.success) {
              registerSuccess = true;
            }
          }
        }
        
        if (registerSuccess) {
          alert('Cuenta creada. Iniciando sesion...');
          setTimeout(() => {
            document.getElementById('login-email').value = email;
            document.getElementById('login-password').value = password;
            handleLogin(new Event('submit'));
          }, 1000);
        } else {
          alert(parseErrorMessage(result, 'Error al crear cuenta'));
        }
      } catch (err) {
        alert('Error de conexion');
      }
    }
    // If already logged in, redirect to dashboard
    if (localStorage.getItem('token')) {
      window.location.href = 'dashboard.html';
    }
  </script>
</body>
</html>
