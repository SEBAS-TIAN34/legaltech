<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LegalTech - Iniciar Sesión</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="login-page">
  <div class="login-container">
    <div class="login-card">
      <div class="login-logo">
        <i class="fas fa-scale-balanced"></i>
        <h1>LegalTech</h1>
      </div>
      <p class="login-subtitle">Sistema de Gestión Legal</p>
      
      <div class="login-tabs">
        <button class="login-tab active" onclick="showTab('login')">Iniciar Sesión</button>
        <button class="login-tab" onclick="showTab('register')">Registrarse</button>
      </div>
      
      <!-- Login Form -->
      <form id="login-form" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="login-email" placeholder="tu@email.com" required>
        </div>
        <div class="form-group">
          <label>Contraseña</label>
          <input type="password" id="login-password" placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn-primary">Entrar</button>
      </form>
      
      <!-- Register Form -->
      <form id="register-form" class="hidden" onsubmit="handleRegister(event)">
        <div class="form-row">
          <div class="form-group">
            <label>Nombre</label>
            <input type="text" id="register-firstName" placeholder="Nombre" required>
          </div>
          <div class="form-group">
            <label>Apellido</label>
            <input type="text" id="register-lastName" placeholder="Apellido" required>
          </div>
        </div>
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="register-email" placeholder="tu@email.com" required>
        </div>
        <div class="form-group">
          <label>Contraseña</label>
          <input type="password" id="register-password" placeholder="••••••••" required>
        </div>
        <div class="form-group">
          <label>Tipo</label>
          <select id="register-role" required>
            <option value="lawyer">Abogado</option>
            <option value="client">Cliente</option>
          </select>
        </div>
        <button type="submit" class="btn-primary">Crear Cuenta</button>
      </form>
    </div>
  </div>

  <script>
    // Supabase Configuration
    const SUPABASE_URL = 'https://zftczusnrhslgpgrpzrs.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_J2uBdxcUW1HjyEA8VjHlLA_5TSWWOJo';

    const BASE_URL = `${SUPABASE_URL}/rest/v1`;
    const API_URL = {
      users: `${BASE_URL}/users`,
      cases: `${BASE_URL}/cases`,
      clients: `${BASE_URL}/clients`,
      documents: `${BASE_URL}/documents`,
      time_entries: `${BASE_URL}/time_entries`,
      invoices: `${BASE_URL}/invoices`
    };

    function getSelectHeaders() {
      return {
        'apikey': SUPABASE_KEY,
        'Authorization': `Bearer ${SUPABASE_KEY}`
      };
    }

    function getHeaders() {
      return {
        'Content-Type': 'application/json',
        'apikey': SUPABASE_KEY,
        'Prefer': 'return=minimal'
      };
    }

    function showTab(tab) {
      document.querySelectorAll('.login-tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('form').forEach(f => f.classList.add('hidden'));
      
      if (tab === 'login') {
        document.querySelectorAll('.login-tab')[0].classList.add('active');
        document.getElementById('login-form').classList.remove('hidden');
      } else {
        document.querySelectorAll('.login-tab')[1].classList.add('active');
        document.getElementById('register-form').classList.remove('hidden');
      }
    }

    async function handleLogin(e) {
      e.preventDefault();
      const email = document.getElementById('login-email').value;
      const password = document.getElementById('login-password').value;
      
      try {
        const res = await fetch(`${API_URL.users}?email=eq.${encodeURIComponent(email)}&password=eq.${encodeURIComponent(password)}`, {
          headers: getSelectHeaders()
        });
        const users = await res.json();
        
        if (users && users.length > 0) {
          const user = normalizeUser(users[0]);
          localStorage.setItem('token', user.id.toString());
          localStorage.setItem('user', JSON.stringify(user));
          window.location.href = 'app.html';
        } else {
          alert('Credenciales incorrectas');
        }
      } catch (err) {
        alert('Error de conexión');
      }
    }

    function normalizeUser(user) {
      const firstName = user.firstName || user.first_name || '';
      const lastName = user.lastName || user.last_name || '';
      return {
        ...user,
        firstName,
        lastName,
        name: user.name || `${firstName} ${lastName}`.trim()
      };
    }

    async function handleRegister(e) {
      e.preventDefault();
      const firstName = document.getElementById('register-firstName').value;
      const lastName = document.getElementById('register-lastName').value;
      const email = document.getElementById('register-email').value;
      const password = document.getElementById('register-password').value;
      const role = document.getElementById('register-role').value;
      const now = new Date().toISOString();
      
      try {
        const res = await fetch(API_URL.users, {
          method: 'POST',
          headers: getHeaders(),
          body: JSON.stringify({
            id: crypto.randomUUID(),
            email, 
            password, 
            first_name: firstName,
            last_name: lastName,
            role,
            createdAt: now,
            updatedAt: now
          })
        });
        
        if (res.ok) {
          alert('Cuenta creada. Iniciando sesión...');
          setTimeout(() => {
            document.getElementById('login-email').value = email;
            document.getElementById('login-password').value = password;
            handleLogin(new Event('submit'));
          }, 1000);
        } else {
          alert('Error al crear cuenta');
        }
      } catch (err) {
        alert('Error de conexión');
      }
    }

    // If already logged in, redirect to dashboard
    if (localStorage.getItem('token')) {
      window.location.href = 'dashboard.html';
    }
  </script>
</body>
</html>
