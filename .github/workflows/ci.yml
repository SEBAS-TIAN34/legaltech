name: CI - Integración Continua

on:
  push:
    branches: [ main, develop, master ]
  pull_request:
    branches: [ main, develop, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        service: [auth-service, cases-service, notifications-service, clients-service, documents-service, time-tracking-service, billing-service, notifications-service, dashboard-service]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
      
      - name: Install dependencies
        run: |
          cd ${{ matrix.service }}
          npm install --silent
      
      - name: Verify syntax
        run: |
          cd ${{ matrix.service }}
          node --check src/index.js || node --check src/server.js || true
      
      - name: Check for lint errors
        run: |
          cd ${{ matrix.service }}
          npx eslint src/ --max-warnings=50 --format stylish || true