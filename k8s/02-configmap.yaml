apiVersion: v1
kind: ConfigMap
metadata:
  name: legaltech-config
  namespace: legaltech
data:
  # Environment
  NODE_ENV: "production"
  
  # Service URLs (for inter-service communication)
  AUTH_SERVICE_URL: "http://auth-service:3001"
  CASES_SERVICE_URL: "http://cases-service:3002"
  CLIENTS_SERVICE_URL: "http://clients-service:3003"
  DOCUMENTS_SERVICE_URL: "http://documents-service:3004"
  TIME_TRACKING_SERVICE_URL: "http://time-tracking-service:3005"
  BILLING_SERVICE_URL: "http://billing-service:3006"
  NOTIFICATIONS_SERVICE_URL: "http://notifications-service:3007"
  DASHBOARD_SERVICE_URL: "http://dashboard-service:3008"
  
  # Document storage
  UPLOAD_PATH: "./uploads"
  MAX_FILE_SIZE: "52428800"