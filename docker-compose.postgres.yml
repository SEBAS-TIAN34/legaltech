version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: legaltech-postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: legaltech
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - legaltech-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d legaltech"]
      interval: 10s
      timeout: 5s
      retries: 5

  auth-service:
    build:
      context: ./backend/auth-service
      dockerfile: Dockerfile
    container_name: auth-service
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: legaltech
      DB_USER: admin
      DB_PASSWORD: admin123
      JWT_SECRET: your-secret-key
      NODE_ENV: development
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - legaltech-network
    restart: unless-stopped

  cases-service:
    build:
      context: ./backend/cases-service
      dockerfile: Dockerfile
    container_name: cases-service
    ports:
      - "3002:3002"
    environment:
      PORT: 3002
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: legaltech
      DB_USER: admin
      DB_PASSWORD: admin123
      NODE_ENV: development
      JWT_SECRET: your-secret-key
      AUTH_SERVICE_URL: http://auth-service:3001
    depends_on:
      postgres:
        condition: service_healthy
      auth-service:
        condition: service_started
    networks:
      - legaltech-network
    restart: unless-stopped

  clients-service:
    build:
      context: ./backend/clients-service
      dockerfile: Dockerfile
    container_name: clients-service
    ports:
      - "3003:3003"
    environment:
      PORT: 3003
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: legaltech
      DB_USER: admin
      DB_PASSWORD: admin123
      NODE_ENV: development
      JWT_SECRET: your-secret-key
      AUTH_SERVICE_URL: http://auth-service:3001
    depends_on:
      postgres:
        condition: service_healthy
      auth-service:
        condition: service_started
    networks:
      - legaltech-network
    restart: unless-stopped

  documents-service:
    build:
      context: ./backend/documents-service
      dockerfile: Dockerfile
    container_name: documents-service
    ports:
      - "3004:3004"
    environment:
      PORT: 3004
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: legaltech
      DB_USER: admin
      DB_PASSWORD: admin123
      NODE_ENV: development
      JWT_SECRET: your-secret-key
      UPLOAD_PATH: ./uploads
      MAX_FILE_SIZE: 52428800
      AUTH_SERVICE_URL: http://auth-service:3001
    depends_on:
      postgres:
        condition: service_healthy
      auth-service:
        condition: service_started
    volumes:
      - documents_uploads:/app/uploads
    networks:
      - legaltech-network
    restart: unless-stopped

  time-tracking-service:
    build:
      context: ./backend/time-tracking-service
      dockerfile: Dockerfile
    container_name: time-tracking-service
    ports:
      - "3005:3005"
    environment:
      PORT: 3005
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: legaltech
      DB_USER: admin
      DB_PASSWORD: admin123
      NODE_ENV: development
      JWT_SECRET: your-secret-key
      AUTH_SERVICE_URL: http://auth-service:3001
      CASES_SERVICE_URL: http://cases-service:3002
    depends_on:
      postgres:
        condition: service_healthy
      auth-service:
        condition: service_started
      cases-service:
        condition: service_started
    networks:
      - legaltech-network
    restart: unless-stopped

  billing-service:
    build:
      context: ./backend/billing-service
      dockerfile: Dockerfile
    container_name: billing-service
    ports:
      - "3006:3006"
    environment:
      PORT: 3006
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: legaltech
      DB_USER: admin
      DB_PASSWORD: admin123
      NODE_ENV: development
      JWT_SECRET: your-secret-key
      AUTH_SERVICE_URL: http://auth-service:3001
      CLIENTS_SERVICE_URL: http://clients-service:3003
      TIME_TRACKING_SERVICE_URL: http://time-tracking-service:3005
    depends_on:
      postgres:
        condition: service_healthy
      auth-service:
        condition: service_started
      clients-service:
        condition: service_started
      time-tracking-service:
        condition: service_started
    networks:
      - legaltech-network
    restart: unless-stopped

  notifications-service:
    build:
      context: ./backend/notifications-service
      dockerfile: Dockerfile
    container_name: notifications-service
    ports:
      - "3007:3007"
    environment:
      PORT: 3007
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: legaltech
      DB_USER: admin
      DB_PASSWORD: admin123
      NODE_ENV: development
      JWT_SECRET: your-secret-key
      AUTH_SERVICE_URL: http://auth-service:3001
      EMAIL_HOST: smtp.example.com
      EMAIL_PORT: 587
      EMAIL_USER: noreply@legaltech.com
      EMAIL_PASSWORD: change_password
      EMAIL_FROM: noreply@legaltech.com
    depends_on:
      postgres:
        condition: service_healthy
      auth-service:
        condition: service_started
    networks:
      - legaltech-network
    restart: unless-stopped

  dashboard-service:
    build:
      context: ./backend/dashboard-service
      dockerfile: Dockerfile
    container_name: dashboard-service
    ports:
      - "3008:3008"
    environment:
      PORT: 3008
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: legaltech
      DB_USER: admin
      DB_PASSWORD: admin123
      NODE_ENV: development
      JWT_SECRET: your-secret-key
      AUTH_SERVICE_URL: http://auth-service:3001
      CASES_SERVICE_URL: http://cases-service:3002
      CLIENTS_SERVICE_URL: http://clients-service:3003
      DOCUMENTS_SERVICE_URL: http://documents-service:3004
      TIME_TRACKING_SERVICE_URL: http://time-tracking-service:3005
      BILLING_SERVICE_URL: http://billing-service:3006
      NOTIFICATIONS_SERVICE_URL: http://notifications-service:3007
    depends_on:
      postgres:
        condition: service_healthy
      auth-service:
        condition: service_started
      cases-service:
        condition: service_started
      clients-service:
        condition: service_started
      documents-service:
        condition: service_started
      time-tracking-service:
        condition: service_started
      billing-service:
        condition: service_started
      notifications-service:
        condition: service_started
    networks:
      - legaltech-network
    restart: unless-stopped

networks:
  legaltech-network:
    driver: bridge

volumes:
  postgres_data:
  documents_uploads: