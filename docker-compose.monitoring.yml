services:
  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: legaltech-prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - legaltech-monitoring
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.3.0
    container_name: legaltech-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    networks:
      - legaltech-monitoring
    restart: unless-stopped

  blackbox-exporter:
    image: prom/blackbox-exporter:v0.25.0
    container_name: legaltech-blackbox-exporter
    ports:
      - "9115:9115"
    networks:
      - legaltech-monitoring
    restart: unless-stopped

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: legaltech-cadvisor
    ports:
      - "8081:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks:
      - legaltech-monitoring
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: legaltech-node-exporter
    ports:
      - "9100:9100"
    networks:
      - legaltech-monitoring
    restart: unless-stopped

networks:
  legaltech-monitoring:
    driver: bridge

volumes:
  prometheus_data:
  grafana_data:
