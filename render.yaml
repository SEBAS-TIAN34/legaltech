services:
  # PostgreSQL Database
  - name: postgres
    image: postgres:15-alpine
    plan: free
    environment:
      POSTGRES_USER: legaltech
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: legaltech
    disk:
      name: postgres-data
      sizeGB: 1
    ports:
      - target: 5432
        protocol: tcp

  # Auth Service
  - name: auth-service
    image: ${IMAGE_URL}/auth-service:latest
    plan: free
    envVars:
      - key: PORT
        value: "3001"
      - key: DB_HOST
        value: postgres.internal
      - key: DB_PORT
        value: "5432"
      - key: DB_NAME
        value: legaltech
      - key: DB_USER
        value: legaltech
      - key: DB_PASSWORD
        value: ${POSTGRES_PASSWORD}
      - key: JWT_SECRET
        value: ${JWT_SECRET}
    dependsOn:
      - postgres

  # Cases Service
  - name: cases-service
    image: ${IMAGE_URL}/cases-service:latest
    plan: free
    envVars:
      - key: PORT
        value: "3002"
      - key: DB_HOST
        value: postgres.internal
      - key: DB_PORT
        value: "5432"
      - key: DB_NAME
        value: legaltech
      - key: DB_USER
        value: legaltech
      - key: DB_PASSWORD
        value: ${POSTGRES_PASSWORD}
      - key: JWT_SECRET
        value: ${JWT_SECRET}
      - key: AUTH_SERVICE_URL
        value: http://auth-service:3001
    dependsOn:
      - postgres
      - auth-service

  # Clients Service
  - name: clients-service
    image: ${IMAGE_URL}/clients-service:latest
    plan: free
    envVars:
      - key: PORT
        value: "3003"
      - key: DB_HOST
        value: postgres.internal
      - key: DB_PORT
        value: "5432"
      - key: DB_NAME
        value: legaltech
      - key: DB_USER
        value: legaltech
      - key: DB_PASSWORD
        value: ${POSTGRES_PASSWORD}
      - key: JWT_SECRET
        value: ${JWT_SECRET}
      - key: AUTH_SERVICE_URL
        value: http://auth-service:3001
    dependsOn:
      - postgres
      - auth-service

  # Documents Service
  - name: documents-service
    image: ${IMAGE_URL}/documents-service:latest
    plan: free
    envVars:
      - key: PORT
        value: "3004"
      - key: DB_HOST
        value: postgres.internal
      - key: DB_PORT
        value: "5432"
      - key: DB_NAME
        value: legaltech
      - key: DB_USER
        value: legaltech
      - key: DB_PASSWORD
        value: ${POSTGRES_PASSWORD}
      - key: JWT_SECRET
        value: ${JWT_SECRET}
      - key: AUTH_SERVICE_URL
        value: http://auth-service:3001
    dependsOn:
      - postgres
      - auth-service

  # Time Tracking Service
  - name: time-tracking-service
    image: ${IMAGE_URL}/time-tracking-service:latest
    plan: free
    envVars:
      - key: PORT
        value: "3005"
      - key: DB_HOST
        value: postgres.internal
      - key: DB_PORT
        value: "5432"
      - key: DB_NAME
        value: legaltech
      - key: DB_USER
        value: legaltech
      - key: DB_PASSWORD
        value: ${POSTGRES_PASSWORD}
      - key: JWT_SECRET
        value: ${JWT_SECRET}
      - key: AUTH_SERVICE_URL
        value: http://auth-service:3001
    dependsOn:
      - postgres
      - auth-service

  # Billing Service
  - name: billing-service
    image: ${IMAGE_URL}/billing-service:latest
    plan: free
    envVars:
      - key: PORT
        value: "3006"
      - key: DB_HOST
        value: postgres.internal
      - key: DB_PORT
        value: "5432"
      - key: DB_NAME
        value: legaltech
      - key: DB_USER
        value: legaltech
      - key: DB_PASSWORD
        value: ${POSTGRES_PASSWORD}
      - key: JWT_SECRET
        value: ${JWT_SECRET}
      - key: AUTH_SERVICE_URL
        value: http://auth-service:3001
    dependsOn:
      - postgres
      - auth-service

  # Notifications Service
  - name: notifications-service
    image: ${IMAGE_URL}/notifications-service:latest
    plan: free
    envVars:
      - key: PORT
        value: "3007"
      - key: DB_HOST
        value: postgres.internal
      - key: DB_PORT
        value: "5432"
      - key: DB_NAME
        value: legaltech
      - key: DB_USER
        value: legaltech
      - key: DB_PASSWORD
        value: ${POSTGRES_PASSWORD}
      - key: JWT_SECRET
        value: ${JWT_SECRET}
      - key: AUTH_SERVICE_URL
        value: http://auth-service:3001
    dependsOn:
      - postgres
      - auth-service

  # Dashboard Service
  - name: dashboard-service
    image: ${IMAGE_URL}/dashboard-service:latest
    plan: free
    envVars:
      - key: PORT
        value: "3008"
      - key: DB_HOST
        value: postgres.internal
      - key: DB_PORT
        value: "5432"
      - key: DB_NAME
        value: legaltech
      - key: DB_USER
        value: legaltech
      - key: DB_PASSWORD
        value: ${POSTGRES_PASSWORD}
      - key: JWT_SECRET
        value: ${JWT_SECRET}
      - key: AUTH_SERVICE_URL
        value: http://auth-service:3001
    dependsOn:
      - postgres
      - auth-service

  # Nginx Frontend
  - name: nginx
    image: ${IMAGE_URL}/nginx:latest
    plan: free
    envVars:
      - key: PORT
        value: "80"
    routes:
      - path: /
    dependsOn:
      - auth-service
      - cases-service
      - clients-service
      - documents-service
      - time-tracking-service
      - billing-service
      - notifications-service
      - dashboard-service