apiVersion: apps/v1
kind: Deployment
metadata:
  name: documents-service
  namespace: legaltech
spec:
  replicas: 2
  selector:
    matchLabels:
      app: documents-service
  template:
    metadata:
      labels:
        app: documents-service
    spec:
      containers:
      - name: documents-service
        image: documents-service:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3004
        env:
        - name: PORT
          value: "3004"
        - name: DB_HOST
          valueFrom:
            secretKeyRef:
              name: legaltech-secrets
              key: DB_HOST
        - name: DB_PORT
          valueFrom:
            secretKeyRef:
              name: legaltech-secrets
              key: DB_PORT
        - name: DB_NAME
          valueFrom:
            secretKeyRef:
              name: legaltech-secrets
              key: DB_NAME
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: legaltech-secrets
              key: DB_USER
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: legaltech-secrets
              key: DB_PASSWORD
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: legaltech-secrets
              key: JWT_SECRET
        - name: AUTH_SERVICE_URL
          valueFrom:
            configMapKeyRef:
              name: legaltech-config
              key: AUTH_SERVICE_URL
        - name: UPLOAD_PATH
          valueFrom:
            configMapKeyRef:
              name: legaltech-config
              key: UPLOAD_PATH
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
        livenessProbe:
          httpGet:
            path: /health
            port: 3004
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /health
            port: 3004
          initialDelaySeconds: 5
          periodSeconds: 10
        volumeMounts:
        - name: documents-storage
          mountPath: /app/uploads
      volumes:
      - name: documents-storage
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: documents-service
  namespace: legaltech
spec:
  type: ClusterIP
  ports:
  - port: 3004
    targetPort: 3004
  selector:
    app: documents-service