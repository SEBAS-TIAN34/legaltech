openapi: 3.0.0
info:
  title: LegalTech API
  description: Sistema de Gestión Legal - Microservices API
  version: 1.0.0
  contact:
    name: LegalTech Support
    email: support@legaltech.com

servers:
  - url: http://localhost:3001
    description: Auth Service
  - url: http://localhost:3002
    description: Cases Service
  - url: http://localhost:3003
    description: Clients Service
  - url: http://localhost:3004
    description: Documents Service
  - url: http://localhost:3005
    description: Time Tracking Service
  - url: http://localhost:3006
    description: Billing Service
  - url: http://localhost:3007
    description: Notifications Service
  - url: http://localhost:3008
    description: Dashboard Service

tags:
  - name: Auth
    description: Authentication and User Management
  - name: Cases
    description: Legal Cases Management
  - name: Clients
    description: Client Management
  - name: Documents
    description: Document Management
  - name: TimeTracking
    description: Time Tracking
  - name: Billing
    description: Invoicing and Payments
  - name: Notifications
    description: Notifications and Alerts
  - name: Dashboard
    description: Dashboard and Analytics

paths:
  /api/auth/register:
    post:
      tags:
        - Auth
      summary: Register new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
                - firstName
                - lastName
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 6
                firstName:
                  type: string
                lastName:
                  type: string
                role:
                  type: string
                  enum: [admin, lawyer, paralegal, assistant]
      responses:
        '201':
          description: User created successfully
        '400':
          description: Validation error

  /api/auth/login:
    post:
      tags:
        - Auth
      summary: User login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                password:
                  type: string
      responses:
        '200':
          description: Login successful
        '401':
          description: Invalid credentials

  /api/auth/profile:
    get:
      tags:
        - Auth
      summary: Get current user profile
      security:
        - bearerAuth: []
      responses:
        '200':
          description: User profile
        '401':
          description: Unauthorized

  /api/cases:
    get:
      tags:
        - Cases
      summary: Get all cases
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 10
      responses:
        '200':
          description: List of cases
        '401':
          description: Unauthorized

    post:
      tags:
        - Cases
      summary: Create new case
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - title
                - description
              properties:
                title:
                  type: string
                description:
                  type: string
                caseType:
                  type: string
                priority:
                  type: string
                  enum: [low, medium, high]
      responses:
        '201':
          description: Case created
        '401':
          description: Unauthorized

  /api/clients:
    get:
      tags:
        - Clients
      summary: Get all clients
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of clients

    post:
      tags:
        - Clients
      summary: Create new client
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - email
              properties:
                name:
                  type: string
                email:
                  type: string
                phone:
                  type: string
                clientType:
                  type: string
                  enum: [individual, company]
      responses:
        '201':
          description: Client created

  /api/documents:
    get:
      tags:
        - Documents
      summary: Get all documents
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of documents

    post:
      tags:
        - Documents
      summary: Upload document
      security:
        - bearerAuth: []
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                title:
                  type: string
      responses:
        '201':
          description: Document uploaded

  /api/time-entries:
    get:
      tags:
        - TimeTracking
      summary: Get all time entries
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of time entries

    post:
      tags:
        - TimeTracking
      summary: Create time entry
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - description
                - duration
              properties:
                description:
                  type: string
                duration:
                  type: integer
                billable:
                  type: boolean
      responses:
        '201':
          description: Time entry created

  /api/invoices:
    get:
      tags:
        - Billing
      summary: Get all invoices
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of invoices

    post:
      tags:
        - Billing
      summary: Create invoice
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - clientId
                - items
              properties:
                clientId:
                  type: string
                items:
                  type: array
                  items:
                    type: object
                    properties:
                      description:
                        type: string
                      quantity:
                        type: number
                      unitPrice:
                        type: number
      responses:
        '201':
          description: Invoice created

  /api/notifications:
    get:
      tags:
        - Notifications
      summary: Get all notifications
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of notifications

  /api/dashboard/stats:
    get:
      tags:
        - Dashboard
      summary: Get dashboard statistics
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Dashboard statistics

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    User:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        role:
          type: string
        isActive:
          type: boolean

    Case:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        description:
          type: string
        status:
          type: string
          enum: [draft, open, in_progress, closed, suspended]
        priority:
          type: string
          enum: [low, medium, high]

    Client:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
        phone:
          type: string
        clientType:
          type: string
          enum: [individual, company]

    Error:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string