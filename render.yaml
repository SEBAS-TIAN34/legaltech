        value: "5432"
      - key: DB_NAME
        value: legaltech
      - key: DB_USER
        value: legaltech
      - key: DB_PASSWORD
        value: ${POSTGRES_PASSWORD}
      - key: JWT_SECRET
        value: ${JWT_SECRET}
      - key: AUTH_SERVICE_URL
        value: http://auth-service:3001
    dependsOn:
      - postgres

