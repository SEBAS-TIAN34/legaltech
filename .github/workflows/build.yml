name: Build and Push Docker Images

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository.toLowerCase() }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-

      - name: Build and push auth-service
        uses: docker/build-push-action@v5
        with:
          context: ./auth-service
          push: true
          tags: ghcr.io/${{ github.repository.toLowerCase() }}/auth-service:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push cases-service
        uses: docker/build-push-action@v5
        with:
          context: ./cases-service
          push: true
          tags: ghcr.io/${{ github.repository.toLowerCase() }}/cases-service:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push clients-service
        uses: docker/build-push-action@v5
        with:
          context: ./clients-service
          push: true
          tags: ghcr.io/${{ github.repository.toLowerCase() }}/clients-service:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push documents-service
        uses: docker/build-push-action@v5
        with:
          context: ./documents-service
          push: true
          tags: ghcr.io/${{ github.repository.toLowerCase() }}/documents-service:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push time-tracking-service
        uses: docker/build-push-action@v5
        with:
          context: ./time-tracking-service
          push: true
          tags: ghcr.io/${{ github.repository.toLowerCase() }}/time-tracking-service:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push billing-service
        uses: docker/build-push-action@v5
        with:
          context: ./billing-service
          push: true
          tags: ghcr.io/${{ github.repository.toLowerCase() }}/billing-service:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push notifications-service
        uses: docker/build-push-action@v5
        with:
          context: ./notifications-service
          push: true
          tags: ghcr.io/${{ github.repository.toLowerCase() }}/notifications-service:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push dashboard-service
        uses: docker/build-push-action@v5
        with:
          context: ./dashboard-service
          push: true
          tags: ghcr.io/${{ github.repository.toLowerCase() }}/dashboard-service:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push nginx
        uses: docker/build-push-action@v5
        with:
          context: ./nginx
          push: true
          tags: ghcr.io/${{ github.repository.toLowerCase() }}/nginx:latest

      - name: Image digest
        run: echo ${{ steps.meta.outputs.tags }}