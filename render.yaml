services:
  - name: auth-service
    type: web
    runtime: docker
    image: "ghcr.io/sebas-tian34/legalthtech/auth-service:latest"
    plan: free
    envVars:
      - key: PORT
        value: "3001"
      - key: DB_HOST
        value: ${PGHOST}
      - key: DB_PORT
        value: "5432"
      - key: DB_NAME
        value: legaltech
      - key: DB_USER
        value: ${PGUSER}
      - key: DB_PASSWORD
        value: ${PGPASSWORD}
      - key: JWT_SECRET
        value: ${JWT_SECRET}

  - name: cases-service
