services:
  - name: auth-service
    type: web
    runtime: node
    buildCommand: npm install && npm start
    repo: https://github.com/SEBAS-TIAN34/legaltech
    branch: main
    plan: free
    envVars:
      - key: PORT
        value: "3001"
      - key: JWT_SECRET
        value: ${JWT_SECRET}
      - key: NODE_ENV
        value: production

  - name: cases-service
    type: web
    runtime: node
    buildCommand: npm install && npm start
    repo: https://github.com/SEBAS-TIAN34/legaltech
    branch: main
    plan: free
    envVars:
      - key: PORT
        value: "3002"
      - key: JWT_SECRET
        value: ${JWT_SECRET}
      - key: AUTH_SERVICE_URL
        value: https://auth-service-[SERVICE_ID].onrender.com

  - name: clients-service
