services:
  - name: postgres
    image: postgres:15-alpine
    plan: free
    envVars:
      - key: POSTGRES_USER
        value: legaltech
      - key: POSTGRES_PASSWORD
        value: ${POSTGRES_PASSWORD}
      - key: POSTGRES_DB
        value: legaltech
    disk:
      name: postgres-data
      sizeGB: 1

  - name: auth-service
    image: ${IMAGE_URL}/auth-service:latest
    plan: free
    envVars:
      - key: PORT
        value: "3001"
      - key: DB_HOST
        value: postgres.internal
      - key: DB_PORT
        value: "5432"
      - key: DB_NAME
        value: legaltech
      - key: DB_USER
        value: legaltech
      - key: DB_PASSWORD
        value: ${POSTGRES_PASSWORD}
      - key: JWT_SECRET
        value: ${JWT_SECRET}
    dependsOn:
      - postgres

  - name: cases-service
    image: ${IMAGE_URL}/cases-service:latest
